# Project Configuration
project_name: "cec_emulator"

# K3D Configuration
k3d:
  install_script: "https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh"
  cluster_name: "cec-emulator"
  host_ports:
    prometheus: 9090
    grafana: 3000
    mubench_service: 8083
    kiali: 3001

# Node Configuration
nodes:
  cloud:
    num_nodes: 2
    cpu_capacity: "4"
    memory_capacity_gb: "4"
    labels:
      - "topology.kubernetes.io/zone=cloud"
  
  edge:
    num_nodes: 4
    cpu_capacity: "4"
    memory_capacity_gb: "4"
    labels:
      - "topology.kubernetes.io/zone=edge"
    network_restrictions:
      rate: "1mbps"
      delay: "100ms"
      loss: "50%"
      duplicate: "50%"
      corrupt: "10%"

# Monitoring installation option
monitoring:
  install: true