apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ service_name }}-autoscaler
  namespace: {{ namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ service_name }}
  minReplicas: {{ min }}
  maxReplicas: {{ max }}
  metrics:
    - type: Resource
      resource:
        name: {{ metric }}
        target:
          type: Utilization
          averageUtilization: {{ target }} 