apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: {{ service_name }}
  namespace: {{ namespace }}
  labels:
    zone: default
    app: {{ service_name }}
    version: "1.0"
  annotations:
    something: something
spec:
  selector:
    matchLabels:
      app: {{ service_name }}
  replicas: {{ replicas }}
  template:
    metadata:
      labels:
        zone: default
        app: {{ service_name }}
        version: "1.0"
        prometheus.io/scrape: 'true'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
    spec:
      terminationGracePeriodSeconds : 3
      schedulerName: {{ scheduler_name }}
      {% if node_affinity %}
      {{- node_affinity | indent(6) }}
      {% endif %}
      {% if pod_antiaffinity %}
      {{- pod_antiaffinity | indent(6) }}
      {% endif %}
      containers:
        - name: {{ service_name }}
          image: {{ image }}
          ports:
            - name: http-mubpodport
              containerPort: 8080
          volumeMounts:
            - name: podinfo
              mountPath: /etc/podinfo
            - name: microservice-workmodel
              mountPath: /app/MSConfig
            - name: microservice-internal-services
              mountPath: /app/MSConfig/InternalServiceFunctions
          env:
            - name: APP
              value: {{ service_name }}
            - name: ZONE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['zone']
            - name: K8S_APP
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: PN
              value: "{{ pn }}"
            - name: TN
              value: "{{ tn }}"
          {% if resources_content == "{}" %}
          resources: {}
          {% else %}
          resources:
{{ resources_content | indent(12) }}
          {% endif %}
          {% if sidecar %}
        - name: {{ service_name }}-sidecar
          image: {{ sidecar }}
          {% endif %}
      volumes:
        - name: podinfo
          downwardAPI:
            items:
              - path: "labels"
                fieldRef:
                  fieldPath: metadata.labels
              - path: "annotations"
                fieldRef:
                  fieldPath: metadata.annotations
        - name: microservice-workmodel
          configMap:
            name: workmodel
        - name: microservice-internal-services
          configMap:
            name: internal-services
