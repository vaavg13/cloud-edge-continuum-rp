apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ vs_name }}
  namespace: {{ namespace }}
spec:
  hosts: ["*"]
  gateways:
  - {{ namespace }}/{{ gateway_name }}
  http:
{% for svc in services %}
  - match:
    - uri: { prefix: "/{{ svc }}" }
    rewrite: { uri: "{{ path }}" }
    route:
    - destination:
        host: {{ svc }}.{{ namespace }}.svc.cluster.local
        port: { number: 80 }
{% endfor %}


